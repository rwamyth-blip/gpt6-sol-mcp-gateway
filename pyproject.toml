[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-for-copilot"
version = "0.1.0"
description = "Production-ready MCP gateway for Copilot. Use as a library or deploy as a FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VihokAI", email = "dev@vihokai.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "gpt-6-sol",
    "llm-gateway",
    "openai-compatible",
    "fastapi",
    "ai-agents",
    "tool-calling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Library mode: talk to an MCP server from your own code.
library = ["mcp>=1.2"]
# Server mode: run the FastAPI gateway and/or the stdio MCP server.
server = ["mcp>=1.2", "fastapi>=0.115", "uvicorn[standard]>=0.30"]
# Everything, for development and Docker images.
all = ["mcp>=1.2", "fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "mkdocs-material>=9.5",
    "mkdocs-minify-plugin>=0.8",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
mcp-for-copilot = "mcp_for_copilot.cli:main"

[project.urls]
Homepage = "https://github.com/rwamyth-blip/mcp-for-copilot"
Documentation = "https://rwamyth-blip.github.io/mcp-for-copilot/"
Repository = "https://github.com/rwamyth-blip/mcp-for-copilot"
Issues = "https://github.com/rwamyth-blip/mcp-for-copilot/issues"
Changelog = "https://github.com/rwamyth-blip/mcp-for-copilot/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_for_copilot"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # ambiguous unicode: Thai text in docstrings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# src-layout: make sure the suite always exercises src/. Without this, a
# non-editable `pip install .` leaves a stale copy in site-packages and the
# tests silently pass against outdated code.
pythonpath = ["src"]
asyncio_mode = "auto"
# tests.scrub_credentials_plugin removes provider keys (OPENAI_API_KEY and
# friends) from the environment before each test. conftest.py only scrubs
# LLM_*/MCP_*/GATEWAY_*, and Settings falls back to OPENAI_API_KEY, so without
# it a developer's exported credential reaches the suite and is printed by a
# failing assertion.
addopts = "-ra --strict-markers --strict-config -p tests.scrub_credentials_plugin"
filterwarnings = ["error::DeprecationWarning:mcp_for_copilot.*"]

[tool.coverage.run]
source = ["src/mcp_for_copilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
