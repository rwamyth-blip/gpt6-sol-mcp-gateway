# ---------------------------------------------------------------------------
# MCP for Copilot — local stack
#
#   docker compose up gateway   # FastAPI gateway on :8000
#   docker compose up mcp       # stdio MCP server (for an MCP client to attach)
#   docker compose up           # both
#
# Copy .env.example to .env and set LLM_API_KEY before starting.
# ---------------------------------------------------------------------------

services:
  gateway:
    build:
      context: .
      target: runtime
    image: mcp-for-copilot:local
    container_name: mcp-for-copilot-gateway
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8000"
      # Point the gateway at the sibling mcp service over HTTP.
      MCP_TRANSPORT: "http"
      MCP_SERVER_URL: "http://mcp:9000/mcp"
      MCP_TIMEOUT_SECONDS: "60"
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - mcp-for-copilot

  mcp:
    build:
      context: .
      target: runtime
    image: mcp-for-copilot:local
    container_name: mcp-for-copilot-mcp
    # The stdio server reads JSON-RPC on stdin. `sleep infinity` keeps the
    # container alive so an MCP client can `docker exec` into it; for a real
    # deployment, attach your MCP client directly to the stdio process.
    command: ["mcp"]
    stdin_open: true
    tty: false
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: "stdio"
      MCP_SERVER_URL: ""
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import mcp_for_copilot, sys; sys.exit(0 if mcp_for_copilot.__version__ else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - mcp-for-copilot

networks:
  mcp-for-copilot:
    driver: bridge
